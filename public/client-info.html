<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundeninformation</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
<header>
    <h1>Kundeninformation</h1>
</header>

<section>
    <h2>Persönliche Daten</h2>
    <p><strong>ID:</strong> <span id="clientUUID"></span></p>
    <p><strong>Name:</strong> <span id="clientName"></span></p>
    <p><strong>Telefon:</strong> <span id="clientPhone"></span></p>
    <p><strong>E-Mail:</strong> <span id="clientEmail"></span></p>
</section>

<section>
    <h2>Bonuspunkte</h2>
    <p><strong>Aktuelle Punkte:</strong> <span id="clientPoints"></span></p>
    <table>
        <thead>
        <tr>
            <th>Datum</th>
            <th>Grund</th>
            <th>Punkte</th>
        </tr>
        </thead>
        <tbody id="pointsHistory">
        </tbody>
    </table>

    <h3>Punkte hinzufügen / entfernen</h3>
    <label for="pointsInput">Punkte:</label>
    <input type="number" id="pointsInput" required>
    <label for="reasonInput">Grund:</label>
    <input type="text" id="reasonInput" required>
    <button onclick="updatePoints('add')">Punkte hinzufügen</button>
    <button onclick="updatePoints('subtract')">Punkte entfernen</button>
</section>
<script src="js/client-info.js"></script>
</body>
</html>
