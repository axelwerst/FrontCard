<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung</title>
    <link rel="stylesheet" href="styles.css">
<!--    <script defer src="script.js"></script>-->
</head>
<body>
<header>
    <h1 data-lang="register">Registrierung</h1>
</header>
<main>
    <form id="registerForm">
        <label data-lang="name">Name:</label>
        <input type="text" id="name" required><br><br>

        <label data-lang="email">E-Mail:</label>
        <input type="email" id="email" required>
        <br><br>

        <label data-lang="password">Passwort:</label>
        <input type="password" id="password" required><br><br>


        <button type="submit" data-lang="submit">Registrieren</button>
    </form>
    <a href="index.html" data-lang="back">Zurück</a>
</main>
<script> src="js/register.js"</script>
</body>
</html>
