<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1 data-lang="login">Einloggen</h1>

</header>git
<main>
    <form id="loginForm">
        <label for="email" data-lang="email">E-Mail:</label>
        <input id="email" type="email" required>

        <label for="password" data-lang="password">Passwort:</label>
        <input id="password" type="password" required>

        <button type="submit" data-lang="submit">Einloggen</button>
    </form>
    <a href="index.html" data-lang="back">Zurück</a>
</main>
<script src="/public/js/login.js"></script>
</body>
</html>
